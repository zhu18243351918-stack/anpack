name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test
      - name: Build web target
        run: pnpm build:web
        env:
          VITE_TARGET: web
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OFFLINE_RECEIPT_PUBLIC_KEY: ${{ secrets.VITE_OFFLINE_RECEIPT_PUBLIC_KEY }}
      - name: Mirror Windows downloads into Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          VERSION=$(node -p "require('./public/release-manifest.json').version")
          FILE=$(node -p "new URL(require('./public/release-manifest.json').installer.url).pathname.split('/').pop()")
          EXPECTED=$(node -p "require('./public/release-manifest.json').installer.sha256")
          mkdir -p dist/downloads
          gh release download "v${VERSION}" --pattern "${FILE}" --dir dist/downloads --clobber
          echo "${EXPECTED}  dist/downloads/${FILE}" | sha256sum --check
          RUNTIME_FILE=$(node -p "const m=require('./public/release-manifest.json');m.runtime?.url?new URL(m.runtime.url).pathname.split('/').pop():''")
          if [ -n "${RUNTIME_FILE}" ]; then
            RUNTIME_EXPECTED=$(node -p "require('./public/release-manifest.json').runtime.sha256")
            gh release download "v${VERSION}" --pattern "${RUNTIME_FILE}" --dir dist/downloads --clobber
            echo "${RUNTIME_EXPECTED}  dist/downloads/${RUNTIME_FILE}" | sha256sum --check
          fi
          node -e "const fs=require('fs');const p='dist/release-manifest.json';const m=JSON.parse(fs.readFileSync(p));m.installer.githubUrl=m.installer.url;m.installer.url=process.env.PUBLIC_URL+'downloads/'+new URL(m.installer.githubUrl).pathname.split('/').pop();if(m.runtime){m.runtime.githubUrl=m.runtime.url;m.runtime.url=process.env.PUBLIC_URL+'downloads/'+new URL(m.runtime.githubUrl).pathname.split('/').pop()}fs.writeFileSync(p,JSON.stringify(m,null,2))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
